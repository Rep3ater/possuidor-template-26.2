modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Ladysnake/Requiem/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://ladysnake.github.io/wiki/requiem"
iconFile="assets/requiem/skull_logo.png"
credits="Ladysnake Team"
authors="Pyrofab, doctor4t, sekoia, UpcraftLP, SciRave"
description='''
Death revamped and ethereal powers — ported to NeoForge 1.21.1.
'''

[[mixins]]
config="mixins.requiem-core.common.json"

[[mixins]]
config="mixins.requiem.common.json"

[[mixins]]
config="mixins.requiem.client.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
