plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 uses Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('jar', Jar).configure {
    from('LICENSE-CODE')
    from('LICENSE-ART')

    // Requiem's local Fabric compatibility shim compiles Event/EventFactory so the
    // NeoForge project can build without a Fabric API compile dependency. Do not
    // ship those two classes: fabric_api_base supplies the real API at runtime,
    // and including both copies creates a JPMS split-package resolution failure.
    exclude 'net/fabricmc/fabric/api/event/Event.class'
    exclude 'net/fabricmc/fabric/api/event/EventFactory*.class'
    exclude 'net/fabricmc/fabric/api/util/TriState.class'

    // Guard the distributable JAR against reintroducing the fabric_api_base
    // split-package conflict.
    doLast {
        def archive = new java.util.zip.ZipFile(archiveFile.get().asFile)
        try {
            def conflictingEntries = java.util.Collections.list(archive.entries()).findAll { entry ->
                entry.name == 'net/fabricmc/fabric/api/event/Event.class' ||
                    entry.name.startsWith('net/fabricmc/fabric/api/event/EventFactory') ||
                    entry.name == 'net/fabricmc/fabric/api/util/TriState.class'
            }
            if (!conflictingEntries.isEmpty()) {
                throw new GradleException(
                    "Requiem JAR still contains Fabric API base classes: " +
                        conflictingEntries.collect { it.name }.join(', ')
                )
            }
        } finally {
            archive.close()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
