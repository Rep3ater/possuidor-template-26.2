name: 1.21.1 Port Compile

on:
  push:
    branches:
      - port/minecraft-1.21.1-neoforge-21.1.172
  pull_request:
    branches:
      - master
      - main
      - port/minecraft-1.21.1-neoforge-21.1.172
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Compile main sources
        run: ./gradlew --no-daemon compileJava
