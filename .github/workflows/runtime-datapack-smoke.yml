name: Runtime datapack smoke test

on:
  push:
    branches:
      - diagnostic/server-datapack-smoke-2026-10-29

jobs:
  server-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Accept server EULA for disposable CI test
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
      - name: Start an actual 26.2 server and capture datapack bootstrap
        shell: bash
        run: |
          set +e
          ./gradlew runServer --no-daemon --stacktrace > server-startup.log 2>&1 &
          server_pid=$!
          set -e
          for attempt in $(seq 1 150); do
            if grep -Eqi 'Done \\([0-9.]+s\\)!|For help, type "help"|All dimensions are saved' server-startup.log; then
              echo "Server completed datapack reload and reached startup."
              tail -n 100 server-startup.log
              kill "$server_pid" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              code=0
              wait "$server_pid" || code=$?
              echo "Gradle/server exited early with code $code."
              echo "--- full server startup log tail ---"
              tail -n 240 server-startup.log || true
              echo "--- filtered error lines ---"
              grep -Ein 'ERROR|FATAL|Failed to load|datapack|registry|Exception|Caused by|eula|Done \\(' server-startup.log | tail -n 160 || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for server readiness."
          echo "--- full server startup log tail ---"
          tail -n 240 server-startup.log || true
          echo "--- filtered error lines ---"
          grep -Ein 'ERROR|FATAL|Failed to load|datapack|registry|Exception|Caused by|eula|Done \\(' server-startup.log | tail -n 160 || true
          kill "$server_pid" 2>/dev/null || true
          exit 1
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-datapack-smoke-logs
          path: |
            server-startup.log
            run/server/logs/latest.log
            run/server/crash-reports/
          if-no-files-found: warn
