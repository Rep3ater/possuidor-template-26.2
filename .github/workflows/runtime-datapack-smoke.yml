name: Runtime datapack smoke test

on:
  push:
    branches:
      - diagnostic/server-datapack-smoke-2026-10-29

jobs:
  server-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Accept server EULA for disposable CI test
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
      - name: Start an actual 26.2 server and capture datapack bootstrap
        shell: bash
        run: |
          set +e
          timeout 240s ./gradlew runServer --no-daemon --stacktrace > server-startup.log 2>&1
          code=$?
          set -e
          echo "Gradle/server exit code: $code"
          if grep -Eqi 'Done \([0-9.]+s\)!|For help, type "help"|All dimensions are saved' server-startup.log; then
            echo "Server completed datapack reload and reached startup."
            exit 0
          fi
          echo "Server never reached the ready state. Relevant errors:"
          grep -Ein 'ERROR|FATAL|Failed to load|datapack|registry|Exception|Caused by|eula|Done \(' server-startup.log | tail -n 160 || true
          exit 1
      - name: Upload startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-datapack-smoke-logs
          path: |
            server-startup.log
            run/server/logs/latest.log
            run/server/crash-reports/
          if-no-files-found: warn
