name: Port migration compile pass

on:
  push:
    branches:
      - fix/minecraft-1.21.1-source-port

permissions:
  contents: write

jobs:
  migrate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source port
        uses: actions/checkout@v4
        with:
          ref: fix/minecraft-1.21.1-source-port
          persist-credentials: true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Apply high-confidence source substitutions
        run: python3 scripts/port_1_21_1_pass.py
      - name: Commit source substitutions to the port branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/main/java; then
            git add src/main/java
            git commit -m "Apply broad Minecraft 1.21.1 source compatibility pass"
            git push origin HEAD:fix/minecraft-1.21.1-source-port
          else
            echo "No source edits from this pass."
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile migrated source
        run: ./gradlew compileJava --no-daemon --stacktrace
