name: Inspect SayIt dependency

on:
  push:
    branches: [feature/sayit-english-compat]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect Say It English JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="sayitenglish-neoforge-1.21.1-1.1.0.jar"
          curl -fsSL https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar -o /tmp/cfr.jar
          mkdir -p /tmp/sayit-dec
          java -jar /tmp/cfr.jar "$JAR" --outputdir /tmp/sayit-dec --silent true
          echo "=== MOD METADATA ==="
          unzip -p "$JAR" META-INF/neoforge.mods.toml
          for f in \
            com/spicesfire/sayitenglish/SayIt.java \
            com/spicesfire/sayitenglish/ChallengeManager.java \
            com/spicesfire/sayitenglish/Config.java \
            com/spicesfire/sayitenglish/Progress.java \
            com/spicesfire/sayitenglish/Languages.java \
            com/spicesfire/sayitenglish/Packets.java \
            com/spicesfire/sayitenglish/client/ChallengeSession.java \
            com/spicesfire/sayitenglish/client/ChallengeHud.java \
            com/spicesfire/sayitenglish/client/SayItClient.java \
            com/spicesfire/sayitenglish/client/Words.java \
            com/spicesfire/sayitenglish/client/UtteranceGate.java \
            com/spicesfire/sayitenglish/platform/Platform.java \
            com/spicesfire/sayitenglish/platform/ClientPlatform.java \
            com/spicesfire/sayitenglish/platform/neoforge/NeoForgePlatform.java \
            com/spicesfire/sayitenglish/platform/neoforge/NeoForgeClientPlatform.java; do
            echo "=== $f ==="
            sed -n '1,300p' "/tmp/sayit-dec/$f" || true
          done
          echo "=== SAYIT MOD TOML CLASS LIBRARY INFO ==="
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -iE 'modId|version|modLoader|dependency|displayName' || true
